<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0812" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>404 — Kinan Maarrawi</title>
    <script>
      /*
       * Language and fx before first paint, using the same storage keys as the main
       * site (src/i18n.js, src/preferences.js) so a choice made in either place
       * carries over. Storage is read defensively: it can throw in private mode.
       */
      (function () {
        function read(key) {
          try { return localStorage.getItem(key); } catch (error) { return null; }
        }
        var lang = read('site_language_v1');
        if (lang !== 'ar' && lang !== 'en') {
          lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        }
        var fx = read('site_fx_v1');
        if (fx !== 'on' && fx !== 'off') {
          fx = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.dataset.fx = fx;
      })();
    </script>
    <style>
      /*
       * Deliberately a single static file with no framework and no build step.
       * An error page has to work when everything else has not.
       */
      * { box-sizing: border-box; }

      html { background: #0b0812; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 4.5rem 1.25rem 2rem;
        color: #f1ecf7;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
        -webkit-font-smoothing: antialiased;
      }

      .stars {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }

      main {
        position: relative;
        width: min(560px, 100%);
        border: 1px solid rgba(126, 62, 190, 0.35);
        border-radius: 0.72rem;
        background: rgba(18, 14, 27, 0.92);
        padding: clamp(1.4rem, 5vw, 2.2rem);
      }

      .kicker {
        margin: 0 0 1.4rem;
        font-size: 0.82rem;
        letter-spacing: 0.05em;
        color: rgba(197, 174, 226, 0.84);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2.6rem, 12vw, 4rem);
        line-height: 1;
        font-weight: 650;
        letter-spacing: 0.02em;
        color: #f3efe9;
      }

      p {
        margin: 0 0 0.4rem;
        font-size: 0.92rem;
        line-height: 1.55;
        color: rgba(241, 236, 247, 0.78);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 1.6rem;
      }

      .links a {
        display: inline-block;
        padding: 0.55rem 1rem;
        border: 1px solid rgba(126, 62, 190, 0.5);
        border-radius: 0.45rem;
        color: #f1ecf7;
        text-decoration: none;
        font-size: 0.86rem;
        transition: background 160ms ease, border-color 160ms ease;
      }

      .links a:hover { background: rgba(126, 62, 190, 0.24); border-color: rgba(157, 110, 214, 0.75); }
      .links a.quiet { border-color: transparent; color: rgba(197, 174, 226, 0.84); }
      .links a.quiet:hover { border-color: rgba(126, 62, 190, 0.5); background: transparent; }

      /* Same cluster as the main site's .site-controls. */
      .controls {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 2;
        display: flex;
        gap: 0.45rem;
      }

      .controls button {
        display: inline-flex;
        align-items: center;
        gap: 0.44rem;
        min-height: 2.5rem;
        padding: 0.54rem 0.72rem;
        border: 1px solid rgba(126, 62, 190, 0.38);
        border-radius: 999px;
        background: rgba(14, 11, 22, 0.72);
        color: rgba(241, 236, 247, 0.9);
        font: inherit;
        font-size: 0.82rem;
        line-height: 1;
        cursor: pointer;
        transition: border-color 160ms ease, background-color 160ms ease;
      }

      .controls button:hover { border-color: rgba(157, 110, 214, 0.72); background: rgba(20, 15, 30, 0.82); }
      .controls .key { color: rgba(157, 110, 214, 0.96); }
      .controls .off { color: rgba(187, 179, 199, 0.7); }
      .controls .divider { width: 1px; height: 0.92rem; background: rgba(157, 110, 214, 0.36); }

      a:focus-visible,
      button:focus-visible { outline: 2px solid rgba(157, 110, 214, 0.9); outline-offset: 2px; }

      .cursor {
        display: inline-block;
        width: 0.55em;
        height: 1.05em;
        margin-inline-start: 0.15em;
        vertical-align: text-bottom;
        background: rgba(197, 174, 226, 0.84);
        animation: blink 1.1s step-end infinite;
      }

      @keyframes blink { 50% { opacity: 0; } }

      html[data-fx="off"] .cursor { animation: none; }
      html[data-fx="off"] * { transition: none !important; }

      /* Custom cursor, as on the main site (src/components/GlobalCursor.jsx). */
      .cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
        width: 7px;
        height: 7px;
        margin: -3.5px 0 0 -3.5px;
        border-radius: 50%;
        background: #7e3ebe;
        pointer-events: none;
        opacity: 0;
        transform: translate3d(-100px, -100px, 0);
        transition: transform 70ms linear, opacity 120ms ease;
      }

      @media (hover: hover) and (pointer: fine) {
        html:not([data-fx="off"]),
        html:not([data-fx="off"]) a,
        html:not([data-fx="off"]) button { cursor: none !important; }
      }

      @media (hover: none), (pointer: coarse) {
        .cursor-dot { display: none; }
      }

      html[data-fx="off"] .cursor-dot { display: none; }

      /* Language wipe, as on the main site (src/languageWipe.js). */
      html[data-wipe]::view-transition-old(root),
      html[data-wipe]::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
      html[data-wipe="ltr"]::view-transition-new(root) { animation: wipe-ltr 480ms cubic-bezier(0.65, 0, 0.35, 1) both; }
      html[data-wipe="rtl"]::view-transition-new(root) { animation: wipe-rtl 480ms cubic-bezier(0.65, 0, 0.35, 1) both; }
      html[data-wipe]::view-transition-group(language-wipe) {
        animation-duration: 480ms;
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
      @keyframes wipe-ltr { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes wipe-rtl { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }

      .wipe-line {
        position: fixed;
        top: 0;
        width: 42px;
        height: 100vh;
        pointer-events: none;
        z-index: 9;
        view-transition-name: language-wipe;
      }
      .wipe-line.is-ltr {
        background: linear-gradient(to left, rgba(176, 132, 232, 0.95) 0 1px, rgba(126, 62, 190, 0.22) 1px, transparent 100%);
      }
      .wipe-line.is-rtl {
        background: linear-gradient(to right, rgba(176, 132, 232, 0.95) 0 1px, rgba(126, 62, 190, 0.22) 1px, transparent 100%);
      }
    </style>
  </head>
  <body>
    <canvas class="stars" aria-hidden="true"></canvas>
    <div class="cursor-dot" aria-hidden="true"></div>

    <div class="controls" dir="ltr">
      <button type="button" id="fx-toggle" aria-pressed="true">
        <span class="key">fx</span><span class="divider" aria-hidden="true"></span><span id="fx-state">on</span>
      </button>
      <button type="button" id="lang-toggle">
        <span class="key" id="lang-current">EN</span><span class="divider" aria-hidden="true"></span><span id="lang-next">العربية</span>
      </button>
    </div>

    <main>
      <p class="kicker"><bdi>&gt; system.error</bdi></p>
      <h1 id="code">404</h1>
      <p id="line-1"></p>
      <p><span id="line-2"></span><span class="cursor" aria-hidden="true"></span></p>
      <div class="links">
        <a href="/" id="home-link"></a>
        <a href="/#projects" class="quiet" id="projects-link"></a>
      </div>
    </main>

    <script>
      (function () {
        var root = document.documentElement;
        var TEXT = {
          en: {
            code: '404',
            line1: 'That path does not resolve.',
            line2: 'The page you were looking for is not here.',
            home: '> return home',
            projects: '> projects',
            current: 'EN',
            next: 'العربية',
            langLabel: 'Switch language',
            fxLabel: 'Animations'
          },
          ar: {
            code: '٤٠٤',
            line1: 'هذا المسار غير موجود.',
            line2: 'الصفحة اللي بتدور عليها مو هون.',
            home: 'العودة للرئيسية',
            projects: 'شوف المشاريع',
            current: 'ع',
            next: 'English',
            langLabel: 'تبديل اللغة',
            fxLabel: 'الحركات'
          }
        };

        function save(key, value) {
          try { localStorage.setItem(key, value); } catch (error) { /* private mode */ }
        }

        function byId(id) { return document.getElementById(id); }

        function applyLanguage(lang) {
          var t = TEXT[lang];
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          byId('code').textContent = t.code;
          byId('line-1').textContent = t.line1;
          byId('line-2').textContent = t.line2;
          byId('home-link').textContent = t.home;
          byId('projects-link').textContent = t.projects;
          byId('lang-current').textContent = t.current;
          byId('lang-next').textContent = t.next;
          byId('lang-toggle').setAttribute('aria-label', t.langLabel);
          byId('fx-toggle').setAttribute('aria-label', t.fxLabel);
        }

        function applyFx(on) {
          root.dataset.fx = on ? 'on' : 'off';
          byId('fx-state').textContent = on ? 'on' : 'off';
          byId('fx-state').className = on ? 'key' : 'off';
          byId('fx-toggle').setAttribute('aria-pressed', String(on));
          if (stars) stars.refresh();
        }

        // Same directional wipe as the main site: the new language is revealed behind
        // a line sweeping in its reading direction. Instant with fx off.
        function wipeTo(next) {
          var dir = next === 'ar' ? 'rtl' : 'ltr';
          if (root.dataset.fx === 'off' || typeof document.startViewTransition !== 'function') {
            applyLanguage(next);
            return;
          }
          var band = 42;
          var width = window.innerWidth;
          var line = document.createElement('div');
          line.className = 'wipe-line is-' + dir;
          line.style.left = (dir === 'ltr' ? -(band - 1) : width - 1) + 'px';
          document.body.appendChild(line);
          root.dataset.wipe = dir;
          var transition = document.startViewTransition(function () {
            applyLanguage(next);
            line.style.left = (dir === 'ltr' ? width - (band - 1) : -1) + 'px';
          });
          transition.finished.finally(function () {
            line.remove();
            delete root.dataset.wipe;
          });
        }

        byId('lang-toggle').addEventListener('click', function () {
          var next = root.lang === 'ar' ? 'en' : 'ar';
          save('site_language_v1', next);
          wipeTo(next);
        });

        var dot = document.querySelector('.cursor-dot');
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
          window.addEventListener('pointermove', function (event) {
            dot.style.opacity = '1';
            dot.style.transform = 'translate3d(' + event.clientX + 'px, ' + event.clientY + 'px, 0)';
          }, { passive: true });
          document.documentElement.addEventListener('pointerleave', function () { dot.style.opacity = '0'; });
        }

        byId('fx-toggle').addEventListener('click', function () {
          var on = root.dataset.fx === 'off';
          save('site_fx_v1', on ? 'on' : 'off');
          applyFx(on);
        });

        /*
         * Standalone copy of src/lib/starfield.js (public/ is not bundled), without
         * scroll handling since this page does not scroll.
         */
        function startStars(canvas) {
          var ctx = canvas.getContext('2d');
          if (!ctx) return null;
          var w = 0, h = 0, radius = 0, list = [], frame = 0, last = 0;

          function make() {
            var count = Math.min(260, Math.max(60, Math.round(Math.PI * radius * radius * 2.2e-5)));
            list = [];
            for (var i = 0; i < count; i += 1) {
              var mix = Math.random();
              var size = mix < 0.72 ? 0.65 + Math.random() * 0.55 : mix < 0.95 ? 1.2 + Math.random() * 0.7 : 2 + Math.random() * 0.82;
              var purple = Math.random() < 0.28;
              list.push({
                orbit: Math.sqrt(Math.random()) * radius,
                angle: Math.random() * Math.PI * 2,
                speed: 0.000025 + Math.random() * 0.00006,
                size: size,
                purple: purple,
                base: purple ? 0.28 + Math.random() * 0.28 : 0.32 + Math.random() * 0.3,
                amp: 0.08 + Math.random() * 0.16,
                tw: 0.001 + Math.random() * 0.0018,
                phase: Math.random() * Math.PI * 2
              });
            }
          }

          function resize() {
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var widthChanged = window.innerWidth !== w;
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (widthChanged) {
              radius = Math.hypot(w, h) * 0.75;
              make();
            }
          }

          function draw(now, advance) {
            ctx.clearRect(0, 0, w, h);
            for (var i = 0; i < list.length; i += 1) {
              var s = list[i];
              if (advance) s.angle += s.speed * (1000 / 60);
              var x = w / 2 + Math.cos(s.angle) * s.orbit;
              var y = h / 2 + Math.sin(s.angle) * s.orbit;
              if (x < -4 || x > w + 4 || y < -4 || y > h + 4) continue;
              var twinkle = advance ? (Math.sin(now * s.tw + s.phase) + 1) * 0.5 : 0.5;
              var alpha = Math.min(s.base + twinkle * s.amp, 0.82);
              ctx.fillStyle = s.purple ? 'rgba(185, 149, 236, ' + alpha + ')' : 'rgba(248, 246, 255, ' + alpha + ')';
              ctx.beginPath();
              ctx.arc(x, y, s.size, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          function animated() { return root.dataset.fx !== 'off' && !document.hidden; }

          function loop(now) {
            frame = 0;
            if (!animated()) return;
            frame = requestAnimationFrame(loop);
            if (now - last < 1000 / 30) return;
            last = now;
            draw(now, true);
          }

          function refresh() {
            draw(performance.now(), false);
            if (!frame && animated()) frame = requestAnimationFrame(loop);
          }

          resize();
          refresh();
          window.addEventListener('resize', function () { resize(); refresh(); }, { passive: true });
          document.addEventListener('visibilitychange', refresh);
          return { refresh: refresh };
        }

        var stars = startStars(document.querySelector('.stars'));
        applyLanguage(root.lang === 'ar' ? 'ar' : 'en');
        applyFx(root.dataset.fx !== 'off');
      })();
    </script>
  </body>
</html>
