<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0812" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>404 — Kinan Maarrawi</title>
    <style>
      /*
       * Deliberately a single static file with no JS framework and no build step.
       * An error page has to work when everything else has not.
       */
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #0b0812;
        color: #f1ecf7;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
        -webkit-font-smoothing: antialiased;
      }

      .glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 38%, rgba(126, 62, 190, 0.22), transparent 62%);
      }

      main {
        position: relative;
        width: min(560px, 100%);
        border: 1px solid rgba(126, 62, 190, 0.35);
        border-radius: 0.72rem;
        background: rgba(18, 14, 27, 0.92);
        padding: clamp(1.4rem, 5vw, 2.2rem);
      }

      .kicker {
        margin: 0 0 1.4rem;
        font-size: 0.82rem;
        letter-spacing: 0.05em;
        color: rgba(197, 174, 226, 0.84);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2.6rem, 12vw, 4rem);
        line-height: 1;
        font-weight: 650;
        letter-spacing: 0.02em;
        color: #f3efe9;
      }

      p {
        margin: 0 0 0.4rem;
        font-size: 0.92rem;
        line-height: 1.55;
        color: rgba(241, 236, 247, 0.78);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 1.6rem;
      }

      a {
        display: inline-block;
        padding: 0.55rem 1rem;
        border: 1px solid rgba(126, 62, 190, 0.5);
        border-radius: 0.45rem;
        color: #f1ecf7;
        text-decoration: none;
        font-size: 0.86rem;
        transition: background 160ms ease, border-color 160ms ease;
      }

      a:hover { background: rgba(126, 62, 190, 0.24); border-color: rgba(157, 110, 214, 0.75); }
      a:focus-visible { outline: 2px solid rgba(157, 110, 214, 0.9); outline-offset: 2px; }

      .cursor {
        display: inline-block;
        width: 0.55em;
        height: 1.05em;
        margin-left: 0.15em;
        vertical-align: text-bottom;
        background: rgba(197, 174, 226, 0.84);
        animation: blink 1.1s step-end infinite;
      }

      @keyframes blink { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main>
      <p class="kicker">&gt; system.error</p>
      <h1>404</h1>
      <p id="line-1">That path does not resolve.</p>
      <p id="line-2">The page you were looking for is not here.<span class="cursor" aria-hidden="true"></span></p>
      <div class="links">
        <a href="/" id="home-link">Return home</a>
      </div>
    </main>

    <script>
      // Match the language the visitor last chose on the site. Read defensively:
      // storage can throw in private mode, and the page must still render.
      (function () {
        var lang;
        try {
          lang = localStorage.getItem('site_language_v1');
        } catch (error) {
          lang = null;
        }
        if (!lang) {
          lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        }
        if (lang !== 'ar') return;

        document.documentElement.lang = 'ar';
        document.documentElement.dir = 'rtl';
        document.getElementById('line-1').textContent = 'هذا المسار غير موجود.';
        document.getElementById('line-2').firstChild.textContent = 'الصفحة اللي بتدور عليها مو هون.';
        document.getElementById('home-link').textContent = 'العودة للرئيسية';
      })();
    </script>
  </body>
</html>
