[build]
  command = "npm run build"
  publish = "dist"

# Pretty URL for the admin entry point. Netlify serves static files before applying
# redirect rules, so this only ever matches the bare /admin path.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Baseline hardening for every response. The CSP is deliberately limited to the
# directives that cannot break anything (no framing, no plugins, no <base> hijack);
# a full script/style policy would need hashes for the inline pre-paint scripts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
